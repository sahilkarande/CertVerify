[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certverify"
version = "0.1.0"
description = "AI-powered Student Academic Document Management System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "cryptography>=42",
]

[project.optional-dependencies]
# Only needed by the seed-data importer (Google Drive download), not by the core platform.
gdrive = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]
dev = [
    "pytest>=8.2",
    "httpx2>=2.0",  # required by starlette.testclient (replaces httpx)
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations: long op lines are fine, everything else is still checked.
"migrations/versions/*.py" = ["E501"]
